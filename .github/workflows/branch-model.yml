name: Branch model
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  branch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Require task PRs into dev and releases from dev
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == dev && "$HEAD_BRANCH" != main && "$HEAD_BRANCH" != dev ]]; then exit 0; fi
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" == dev ]]; then exit 0; fi
          echo 'BRANCH_POLICY: task PRs target dev; only dev may release into main' >&2
          exit 1
